name: CI almadar-shell

on:
  pull_request:
    branches: [main]
    paths: ['templates/almadar-shell/**']
  push:
    branches: [main]
    paths: ['templates/almadar-shell/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/almadar-shell
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: templates/almadar-shell/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm run --if-present test

      - name: Lint
        run: pnpm lint
