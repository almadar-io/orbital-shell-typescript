[package]
name = "orbital-shell-typescript"
version = "18.0.0"
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/almadar-io/orbital-shell-typescript"
description = "TypeScript/React shell for the Orbital compiler"

[dependencies]
orbital-core-base = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
orbital-core-eval = { git = "https://github.com/almadar-io/orbital-core", branch = "main" }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

[dev-dependencies]
pretty_assertions = "1.4"

[package.metadata.almadar]
# npm packages published from this repo (tag <dir>-v<version>, workflow publish-<dir>.yml).
npm-packages = ["templates/almadar-shell"]
