name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --no-frozen-lockfile

      - name: Build (includes token generation)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint --no-warn-ignored --max-warnings 0 src/

      - name: Test
        run: pnpm test
