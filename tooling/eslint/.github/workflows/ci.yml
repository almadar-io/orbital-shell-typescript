name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm run --if-present test

      - name: Lint
        run: pnpm exec eslint --no-warn-ignored --max-warnings 0 index.js rules/ utils/

  # validate-service disabled (service .orb schemas need fixing)
